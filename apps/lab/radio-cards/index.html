<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>dial lab · RadioCards · three ways to choose one of a few described options</title>
<link rel="stylesheet" href="../../../packages/tokens/build/css/tokens.css">
<style>
 body{margin:0;padding:32px;background:var(--ds-surface-page);color:var(--ds-text-primary);font-family:var(--ds-type-family)}
 h1{font-size:18px;font-weight:500;margin:0 0 18px}
 .row{display:flex;flex-wrap:nowrap;gap:24px}
 .unit{inline-size:360px;box-sizing:border-box;padding:24px;border-radius:54px;background:var(--ds-surface-solid);box-shadow:var(--ds-elevation-unit)}
 .unit>h2{font-size:13px;font-weight:500;margin:0 0 20px;color:var(--ds-text-secondary)}
 .set{display:grid;gap:12px}
 .o{position:relative;box-sizing:border-box;display:grid;grid-template-columns:1fr;row-gap:2px;align-items:center;min-block-size:44px;padding:14px 16px;cursor:pointer}
 .o input{position:absolute;opacity:0}
 .t{font-size:16px;line-height:1.3}.d{font-size:14px;line-height:1.45;color:var(--ds-text-secondary)}
 .g{grid-row:1 / span 2;inline-size:24px;block-size:24px;border:1px solid var(--ds-line-ring);border-radius:50%}
 .o:has(:checked) .t{font-weight:500}
 /* A: raised key plate; chosen sits down (no shadow) and carries a bar at its start */
 .A .o{border-radius:16px;background:var(--ds-surface-raised);box-shadow:var(--ds-elevation-part);border:1px solid var(--ds-line-ring)}
 .A .o:has(:checked){box-shadow:none;transform:translateY(2px)}
 .A .o:has(:checked)::before{content:"";position:absolute;inset-inline-start:6px;inset-block:14px;inline-size:4px;border-radius:2px;background:var(--ds-text-primary)}
 /* B: printed legend rows inside one ruled box; bar at the start of the chosen row */
 .B .set{gap:0;border:1px solid var(--ds-line-ring);border-radius:16px}
 .B .o{border-radius:0;padding-inline-start:22px}
 .B .o+.o{border-block-start:1px solid var(--ds-line-divider)}
 .B .o:has(:checked)::before{content:"";position:absolute;inset-inline-start:8px;inset-block:14px;inline-size:4px;border-radius:2px;background:var(--ds-text-primary)}
 /* C: recessed wells; chosen well fills with plastic and a bar under the title */
 .C .o{border-radius:12px;background:var(--ds-surface-sunken);box-shadow:var(--ds-elevation-well)}
 .C .o:has(:checked){background:var(--ds-surface-raised);box-shadow:var(--ds-elevation-part)}
 .C .o:has(:checked) .t::after{content:"";display:block;inline-size:24px;block-size:4px;margin-block-start:4px;border-radius:2px;background:var(--ds-text-primary)}
</style></head><body>
<h1>RadioCards · one choice among described options</h1>
<div class="row">
<script>
const names=['A · raised key plates, chosen sits down with a bar','B · one ruled box of printed rows, bar at the start','C · recessed wells, chosen rises with a bar under the word'];
['A','B','C'].forEach((k,i)=>{document.write(`<div class="unit ${k}"><h2>${names[i]}</h2><div class="set">`+
[['Eco','Lowers the heat when nobody is home.'],['Comfort','Holds 21 degrees all day.'],['Away','Frost guard only.']].map((o,j)=>`<label class="o"><input type="radio" name="g${k}" ${j==1?'checked':''}><span class="t">${o[0]}</span><span class="d">${o[1]}</span></label>`).join('')+`</div></div>`)});
</script>
</div></body></html>
