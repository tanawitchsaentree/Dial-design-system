<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dial lab · book B · the case</title>
<link rel="stylesheet" href="../../../packages/tokens/build/css/tokens.css">
<link rel="stylesheet" href="parts.css">
<style>
  /* B · the case. The whole page is one warm-white ABS body standing on a darker ground; the nav is
     printed on its left edge behind a groove; each section is a unit in a rack. */
  body { background: var(--ds-surface-sunken); padding: 24px; }
  .case { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-block-size: calc(100vh - 48px); border-radius: 40px; background: var(--ds-unit-bg); box-shadow: var(--ds-unit-shadow); }
  .edge { padding: 40px 24px 40px 40px; box-shadow: inset -1px 0 0 var(--ds-line-divider); display: grid; align-content: start; gap: 28px; }
  .wordmark { font-size: 24px; font-weight: 500; letter-spacing: -0.03em; }
  .edge h2 { margin: 0 0 6px; font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ds-text-secondary); }
  .edge ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .edge a { display: flex; align-items: center; gap: 10px; min-block-size: 30px; font-size: 14px; color: var(--ds-text-primary); text-decoration: none; }
  .edge a::before { content: ''; inline-size: 6px; block-size: 6px; border-radius: 50%; box-shadow: var(--ds-elevation-well); background: var(--ds-surface-sunken); }
  .edge a[aria-current]::before { background: var(--ds-text-primary); box-shadow: none; }
  main { padding: 40px; display: grid; gap: 24px; align-content: start; }
  .head { display: flex; justify-content: space-between; align-items: end; }
  .head h1 { margin: 0; font-size: 56px; font-weight: 500; letter-spacing: -0.04em; line-height: 1; }
  .head p { margin: 8px 0 0; font-size: 17px; max-inline-size: 44ch; color: var(--ds-text-secondary); }
  .rack { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px; }
  .slot { grid-column: span 3; padding: 24px; border-radius: 24px; background: var(--ds-surface-solid); box-shadow: var(--ds-elevation-unit); display: grid; gap: 12px; align-content: start; }
  .slot.wide { grid-column: span 6; } .slot.third { grid-column: span 2; }
  .slot h2 { margin: 0; font-size: 14px; font-weight: 500; } .slot p { margin: 0; font-size: 15px; line-height: 1.55; }
  .slot .foot { display: flex; justify-content: space-between; font-size: 12px; color: var(--ds-text-secondary); margin-top: 8px; }
  .facts { display: flex; gap: 20px; font-size: 13px; } .facts span { display: inline-flex; align-items: center; gap: 6px; }
  .demo { display: flex; gap: 24px; align-items: center; } .demo .keys { display: flex; gap: 12px; }
  .tabs { display: inline-flex; padding: 3px; gap: 2px; border-radius: 22px; box-shadow: var(--ds-elevation-well); justify-self: start; }
  .tabs a { padding: 8px 18px; border-radius: 20px; font-size: 14px; color: var(--ds-text-secondary); text-decoration: none; }
  .tabs a[aria-current] { background: var(--ds-surface-solid); box-shadow: var(--ds-elevation-part); color: var(--ds-text-primary); font-weight: 500; }
  .big { font-size: 40px; letter-spacing: -0.03em; }
</style>
</head>
<body>
<div class="case" id="root"></div>
<script type="module">
  import { PAGE, NAV, DISPLAY as D, HOME as H, lcd, key } from './book.js';
  const edge = `<nav class="edge" aria-label="Book"><div class="wordmark">dial</div>${NAV.map(([part, pages]) => `<div><h2>${part}</h2><ol>${pages.map((p) => `<li><a href="#" ${(PAGE === 'home' ? p === 'Overview' : p === 'Display') ? 'aria-current="page"' : ''}>${p}</a></li>`).join('')}</ol></div>`).join('')}</nav>`;
  const slot = (h, body, cls = '', foot = '') => `<section class="slot ${cls}"><h2>${h}</h2>${body}${foot ? `<div class="foot">${foot}</div>` : ''}</section>`;
  const display = `<main><div class="head"><div><h1>${D.title}</h1><p>${D.purpose}</p></div><nav class="tabs">${D.tabs.map((t, i) => `<a href="#" ${i ? '' : 'aria-current="page"'}>${t}</a>`).join('')}</nav></div>
    <div class="rack">${slot('Live demo', `<div class="demo">${lcd()}<div class="keys">${key('Off')}${key('Heat', true)}</div></div><div class="facts">${D.facts.slice(0, 3).map(([v, l]) => `<span><span class="lamp"></span>${l} ${v}</span>`).join('')}</div>`, 'wide', '<span>dial</span><span>display 1</span>')}
    ${slot('Code', `<pre class="code-win"><code>${D.code.replace(/</g, '&lt;')}</code></pre>`, 'wide')}
    ${D.sections.map(([h, p]) => slot(h, `<p>${p}</p>`)).join('')}</div></main>`;
  const home = `<main><div class="head"><div><h1 style="font-size:44px;max-inline-size:18ch">${H.title}</h1><p>${H.lede}</p></div></div>
    <div class="rack">${H.numbers.map(([n, l]) => slot(l, `<span class="big">${n}</span>`, 'third')).join('')}${H.box.map(([h, p]) => slot(h, `<p>${p}</p>`, 'third')).join('')}</div></main>`;
  document.getElementById('root').innerHTML = edge + (PAGE === 'home' ? home : display);
</script>
</body>
</html>
