<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>dial lab · Sparkline · three ways to mark the last value</title>
<link rel="stylesheet" href="../../../packages/tokens/build/css/tokens.css">
<style>
 body{margin:0;padding:32px;background:var(--ds-surface-page);color:var(--ds-text-primary);font-family:var(--ds-type-family)}
 h1{font-size:18px;font-weight:500;margin:0 0 18px}
 .row{display:flex;flex-wrap:wrap;gap:32px}
 .unit{inline-size:340px;padding:26px;border-radius:44px;background:var(--ds-surface-solid);box-shadow:var(--ds-elevation-unit)}
 .unit>h2{font-size:13px;font-weight:500;margin:0 0 6px;color:var(--ds-text-secondary)}
 .unit>p.n{font-size:12px;margin:0 0 16px;color:var(--ds-text-secondary)}
 .line{display:flex;align-items:center;gap:12px;margin:0 0 14px;font-size:14px;text-shadow:var(--ds-print-seat)}
 .line .num{font-variant-numeric:tabular-nums;font-weight:500}
 .box{position:relative;display:inline-block;inline-size:84px;block-size:28px;vertical-align:middle}
 .box svg{position:absolute;inset:0;inline-size:100%;block-size:100%;overflow:visible}
 .ln{fill:none;stroke:var(--ds-text-primary);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
 .dot{position:absolute;inline-size:8px;block-size:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--ds-text-primary)}
 /* B: line sits in a tiny recessed window */
 .B .box{inline-size:100px;block-size:36px;box-sizing:border-box;padding:0;border:1px solid var(--ds-line-ring);border-radius:var(--ds-corner-media);background:var(--ds-surface-sunken);box-shadow:var(--ds-elevation-well)}
 .B .in{position:absolute;inset:6px 10px}
 .B .in svg{inset:0}
 /* C: a hairline at the first value and a ring round the last */
 .C .base{position:absolute;inset-inline:0;border-block-start:1px dashed var(--ds-line-ring)}
 .C .dot{background:var(--ds-surface-solid);border:2px solid var(--ds-text-primary);inline-size:6px;block-size:6px;margin:-5px 0 0 -5px}
 .C .v{font-size:12px;color:var(--ds-text-secondary)}
</style></head><body>
<h1>Sparkline · the same seven readings, three ways to mark where the line ends</h1>
<div class="row" id="row"></div>
<script>
const sets=[['Indoor','21.6 °C',[20.5,21,21.5,20.8,21.2,22,21.6]],['Power','1.8 kW',[0.4,0.5,2.2,2.0,0.9,1.2,1.8]],['Solar','0.0 kWh',[6.5,6.0,4.1,3.2,2.0,0.6,0.0]]];
function spark(vals,k){
 const lo=Math.min(...vals),hi=Math.max(...vals),n=vals.length;
 const X=i=>100*i/(n-1), Y=v=>hi===lo?50:90-80*(v-lo)/(hi-lo);
 const pts=vals.map((v,i)=>X(i)+','+Y(v)).join(' ');
 const svg=`<svg viewBox="0 0 100 100" preserveAspectRatio="none"><polyline class="ln" points="${pts}"/></svg>`;
 const dot=`<span class="dot" style="left:${X(n-1)}%;top:${Y(vals[n-1])}%"></span>`;
 if(k==='B')return `<span class="box"><span class="in">${svg}${dot}</span></span>`;
 if(k==='C')return `<span class="box"><span class="base" style="top:${Y(vals[0])}%"></span>${svg}${dot}</span>`;
 return `<span class="box">${svg}${dot}</span>`;
}
const names={A:['A · ink line, solid end dot','the line is printing; the dot is the one mark'],B:['B · line in a small window','the trend is a tiny reading cut into the body'],C:['C · dashed first-value rule, ring on the end','reads rise and fall against where it began']};
document.getElementById('row').innerHTML=['A','B','C'].map(k=>`<div class="unit ${k}"><h2>${names[k][0]}</h2><p class="n">${names[k][1]}</p>${sets.map(s=>`<p class="line"><span style="inline-size:70px">${s[0]}</span>${spark(s[2],k)}<span class="num">${s[1]}</span></p>`).join('')}<p class="line" style="font-size:14px">Heating ran for ${spark(sets[1][2],k)} most of Wednesday.</p></div>`).join('');
</script></body></html>
