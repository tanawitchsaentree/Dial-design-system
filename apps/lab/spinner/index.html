<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><title>dial lab · Spinner</title>
<link rel="stylesheet" href="../../../packages/tokens/build/css/tokens.css">
<style>
body{margin:0;padding:32px;background:var(--ds-surface-page);color:var(--ds-text-primary);font-family:var(--ds-type-family)}
h1{font-size:18px;font-weight:500;margin:0 0 18px}
.row{display:flex;flex-wrap:wrap;gap:36px}
.unit{inline-size:260px;padding:28px;border-radius:54px;background:var(--ds-surface-solid);box-shadow:var(--ds-elevation-unit)}
h2{font-size:13px;font-weight:500;margin:0 0 20px;color:var(--ds-text-secondary)}
.g{display:inline-grid;gap:var(--ds-space-1);vertical-align:middle}
.g i{display:block;inline-size:var(--ds-space-2);block-size:var(--ds-space-2);border-radius:50%;background:var(--ds-grille-hole);box-shadow:var(--ds-elevation-well);animation:walk calc(var(--ds-duration-fill)*8) steps(1,end) infinite}
.A{grid-template-columns:repeat(3,var(--ds-space-2))}
.B{grid-template-columns:repeat(5,var(--ds-space-2))}
.C{grid-template-columns:repeat(5,var(--ds-space-2))}
.row2{display:flex;align-items:center;gap:12px;margin-block-start:20px;font-size:14px}
@keyframes walk{0%{background:var(--ds-grille-hole-on)}37.5%{background:var(--ds-grille-hole)}}
@keyframes bounce{0%{background:var(--ds-grille-hole-on)}12.5%{background:var(--ds-grille-hole)}}
@keyframes rise{0%{background:var(--ds-grille-hole-on)}50%{background:var(--ds-grille-hole)}}
.B i{animation-duration:calc(var(--ds-duration-fill)*8)}
</style></head><body>
<h1>Spinner · a busy indicator made of holes</h1>
<div class="row">
<div class="unit"><h2>A · a lit trail walks the ring of a 3 by 3 field</h2><div class="g A"><i style="grid-column:1;grid-row:1;animation-delay:calc(var(--ds-duration-fill)*0)"></i><i style="grid-column:2;grid-row:1;animation-delay:calc(var(--ds-duration-fill)*1)"></i><i style="grid-column:3;grid-row:1;animation-delay:calc(var(--ds-duration-fill)*2)"></i><i style="grid-column:3;grid-row:2;animation-delay:calc(var(--ds-duration-fill)*3)"></i><i style="grid-column:3;grid-row:3;animation-delay:calc(var(--ds-duration-fill)*4)"></i><i style="grid-column:2;grid-row:3;animation-delay:calc(var(--ds-duration-fill)*5)"></i><i style="grid-column:1;grid-row:3;animation-delay:calc(var(--ds-duration-fill)*6)"></i><i style="grid-column:1;grid-row:2;animation-delay:calc(var(--ds-duration-fill)*7)"></i></div><div class="row2"><div class="g A"><i style="grid-column:1;grid-row:1;animation-delay:calc(var(--ds-duration-fill)*0)"></i><i style="grid-column:2;grid-row:1;animation-delay:calc(var(--ds-duration-fill)*1)"></i><i style="grid-column:3;grid-row:1;animation-delay:calc(var(--ds-duration-fill)*2)"></i><i style="grid-column:3;grid-row:2;animation-delay:calc(var(--ds-duration-fill)*3)"></i><i style="grid-column:3;grid-row:3;animation-delay:calc(var(--ds-duration-fill)*4)"></i><i style="grid-column:2;grid-row:3;animation-delay:calc(var(--ds-duration-fill)*5)"></i><i style="grid-column:1;grid-row:3;animation-delay:calc(var(--ds-duration-fill)*6)"></i><i style="grid-column:1;grid-row:2;animation-delay:calc(var(--ds-duration-fill)*7)"></i></div> Saving</div></div>
<div class="unit"><h2>B · one lit hole scans along a row of five</h2><div class="g B"><i style="animation-name:bounce;animation-delay:calc(var(--ds-duration-fill)*0)"></i><i style="animation-name:bounce;animation-delay:calc(var(--ds-duration-fill)*1)"></i><i style="animation-name:bounce;animation-delay:calc(var(--ds-duration-fill)*2)"></i><i style="animation-name:bounce;animation-delay:calc(var(--ds-duration-fill)*3)"></i><i style="animation-name:bounce;animation-delay:calc(var(--ds-duration-fill)*4)"></i></div><div class="row2"><div class="g B"><i style="animation-name:bounce;animation-delay:calc(var(--ds-duration-fill)*0)"></i><i style="animation-name:bounce;animation-delay:calc(var(--ds-duration-fill)*1)"></i><i style="animation-name:bounce;animation-delay:calc(var(--ds-duration-fill)*2)"></i><i style="animation-name:bounce;animation-delay:calc(var(--ds-duration-fill)*3)"></i><i style="animation-name:bounce;animation-delay:calc(var(--ds-duration-fill)*4)"></i></div> Saving</div></div>
<div class="unit"><h2>C · a round field fills from the bottom row up</h2><div class="g C"><i style="visibility:hidden"></i><i style="animation-name:rise;animation-delay:calc(var(--ds-duration-fill)*4)"></i><i style="animation-name:rise;animation-delay:calc(var(--ds-duration-fill)*4)"></i><i style="animation-name:rise;animation-delay:calc(var(--ds-duration-fill)*4)"></i><i style="visibility:hidden"></i><i style="animation-name:rise;animation-delay:calc(var(--ds-duration-fill)*3)"></i><i style="animation-name:rise;animation-delay:calc(var(--ds-duration-fill)*3)"></i><i style="animation-name:rise;animation-delay:calc(var(--ds-duration-fill)*3)"></i><i style="animation-name:rise;animation-delay:calc(var(--ds-duration-fill)*3)"></i><i style="animation-name:rise;animation-delay:calc(var(--ds-duration-fill)*3)"></i><i style="animation-name:rise;animation-delay:calc(var(--ds-duration-fill)*2)"></i><i style="animation-name:rise;animation-delay:calc(var(--ds-duration-fill)*2)"></i><i style="animation-name:rise;animation-delay:calc(var(--ds-duration-fill)*2)"></i><i style="animation-name:rise;animation-delay:calc(var(--ds-duration-fill)*2)"></i><i style="animation-name:rise;animation-delay:calc(var(--ds-duration-fill)*2)"></i><i style="animation-name:rise;animation-delay:calc(var(--ds-duration-fill)*1)"></i><i style="animation-name:rise;animation-delay:calc(var(--ds-duration-fill)*1)"></i><i style="animation-name:rise;animation-delay:calc(var(--ds-duration-fill)*1)"></i><i style="animation-name:rise;animation-delay:calc(var(--ds-duration-fill)*1)"></i><i style="animation-name:rise;animation-delay:calc(var(--ds-duration-fill)*1)"></i><i style="visibility:hidden"></i><i style="animation-name:rise;animation-delay:calc(var(--ds-duration-fill)*0)"></i><i style="animation-name:rise;animation-delay:calc(var(--ds-duration-fill)*0)"></i><i style="animation-name:rise;animation-delay:calc(var(--ds-duration-fill)*0)"></i><i style="visibility:hidden"></i></div><div class="row2"><div class="g C"><i style="visibility:hidden"></i><i style="animation-name:rise;animation-delay:calc(var(--ds-duration-fill)*4)"></i><i style="animation-name:rise;animation-delay:calc(var(--ds-duration-fill)*4)"></i><i style="animation-name:rise;animation-delay:calc(var(--ds-duration-fill)*4)"></i><i style="visibility:hidden"></i><i style="animation-name:rise;animation-delay:calc(var(--ds-duration-fill)*3)"></i><i style="animation-name:rise;animation-delay:calc(var(--ds-duration-fill)*3)"></i><i style="animation-name:rise;animation-delay:calc(var(--ds-duration-fill)*3)"></i><i style="animation-name:rise;animation-delay:calc(var(--ds-duration-fill)*3)"></i><i style="animation-name:rise;animation-delay:calc(var(--ds-duration-fill)*3)"></i><i style="animation-name:rise;animation-delay:calc(var(--ds-duration-fill)*2)"></i><i style="animation-name:rise;animation-delay:calc(var(--ds-duration-fill)*2)"></i><i style="animation-name:rise;animation-delay:calc(var(--ds-duration-fill)*2)"></i><i style="animation-name:rise;animation-delay:calc(var(--ds-duration-fill)*2)"></i><i style="animation-name:rise;animation-delay:calc(var(--ds-duration-fill)*2)"></i><i style="animation-name:rise;animation-delay:calc(var(--ds-duration-fill)*1)"></i><i style="animation-name:rise;animation-delay:calc(var(--ds-duration-fill)*1)"></i><i style="animation-name:rise;animation-delay:calc(var(--ds-duration-fill)*1)"></i><i style="animation-name:rise;animation-delay:calc(var(--ds-duration-fill)*1)"></i><i style="animation-name:rise;animation-delay:calc(var(--ds-duration-fill)*1)"></i><i style="visibility:hidden"></i><i style="animation-name:rise;animation-delay:calc(var(--ds-duration-fill)*0)"></i><i style="animation-name:rise;animation-delay:calc(var(--ds-duration-fill)*0)"></i><i style="animation-name:rise;animation-delay:calc(var(--ds-duration-fill)*0)"></i><i style="visibility:hidden"></i></div> Saving</div></div>
</div></body></html>
