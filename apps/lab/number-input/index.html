<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>dial lab · NumberInput · three ways to step a number</title>
<link rel="stylesheet" href="../../../packages/tokens/build/css/tokens.css">
<style>
 body{margin:0;padding:32px;background:var(--ds-surface-page);color:var(--ds-text-primary);font-family:var(--ds-type-family)}
 h1{font-size:18px;font-weight:500;margin:0 0 18px}
 .row{display:flex;flex-wrap:wrap;gap:36px}
 .unit{inline-size:340px;padding:28px;border-radius:54px;background:var(--ds-surface-solid);box-shadow:var(--ds-elevation-unit)}
 .unit>h2{font-size:13px;font-weight:500;margin:0 0 20px;color:var(--ds-text-secondary)}
 .f{display:grid;gap:8px;margin-bottom:20px}
 .f>b{font-size:14px;font-weight:500}
 .w{display:flex;align-items:center;box-sizing:border-box;min-block-size:44px;border:1px solid var(--ds-line-ring);border-radius:var(--ds-corner-media);background:var(--ds-surface-sunken);box-shadow:var(--ds-elevation-well)}
 .v{flex:1;font-size:16px;line-height:1.5;padding:8px 14px;font-variant-numeric:tabular-nums;text-align:end}
 .u{font-size:14px;font-weight:500;color:var(--ds-text-secondary);padding-inline-end:14px}
 .k{inline-size:44px;block-size:44px;display:grid;place-items:center;font-size:22px;color:var(--ds-text-secondary);flex:none}
 /* A: flat ink keys inside the well, split by seams (the generic spinbutton) */
 .A .k{border-radius:0;border-inline:1px solid var(--ds-line-divider)}
 .A .w{overflow:hidden}
 .A .v{text-align:center}
 /* B: raised round keys either side of the window, value right-aligned like an LCD with its unit */
 .B .r{display:flex;gap:8px;align-items:center}
 .B .r .w{flex:1}
 .B .k{border-radius:50%;background:var(--ds-surface-raised);box-shadow:var(--ds-elevation-part);border:1px solid transparent}
 /* C: window alone, a joined capsule pair of keys after it */
 .C .r{display:flex;gap:8px;align-items:center}
 .C .r .w{flex:1}
 .C .pair{display:flex;border-radius:var(--ds-corner-round);background:var(--ds-surface-raised);box-shadow:var(--ds-elevation-part)}
 .C .k{border-radius:var(--ds-corner-round)}
 .C .k+.k{border-inline-start:1px solid var(--ds-line-divider);border-start-start-radius:0;border-end-start-radius:0}
</style></head><body>
<h1>NumberInput · stepping a number</h1>
<div class="row">
 <div class="unit A"><h2>A · ink keys inside the well</h2>
  <div class="f"><b>Target temperature</b><div class="w"><span class="k">−</span><span class="v">21.5</span><span class="u">°C</span><span class="k">+</span></div></div>
  <div class="f"><b>Delay start by</b><div class="w"><span class="k">−</span><span class="v">30</span><span class="u">min</span><span class="k">+</span></div></div></div>
 <div class="unit B"><h2>B · raised keys flank the window</h2>
  <div class="f"><b>Target temperature</b><div class="r"><span class="k">−</span><div class="w"><span class="v">21.5</span><span class="u">°C</span></div><span class="k">+</span></div></div>
  <div class="f"><b>Delay start by</b><div class="r"><span class="k">−</span><div class="w"><span class="v">30</span><span class="u">min</span></div><span class="k">+</span></div></div></div>
 <div class="unit C"><h2>C · window, then a joined key pair</h2>
  <div class="f"><b>Target temperature</b><div class="r"><div class="w"><span class="v">21.5</span><span class="u">°C</span></div><div class="pair"><span class="k">−</span><span class="k">+</span></div></div></div>
  <div class="f"><b>Delay start by</b><div class="r"><div class="w"><span class="v">30</span><span class="u">min</span></div><div class="pair"><span class="k">−</span><span class="k">+</span></div></div></div></div>
</div></body></html>
