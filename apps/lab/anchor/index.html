<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>dial lab · Anchor · three ways to mark where you are on a page</title>
<link rel="stylesheet" href="../../../packages/tokens/build/css/tokens.css">
<style>
 body{margin:0;padding:32px;background:var(--ds-surface-page);color:var(--ds-text-primary);font-family:var(--ds-type-family)}
 h1{font-size:18px;font-weight:500;margin:0 0 18px}
 .row{display:flex;flex-wrap:wrap;gap:36px}
 .unit{inline-size:300px;padding:28px;border-radius:54px;background:var(--ds-surface-solid);box-shadow:var(--ds-elevation-unit)}
 .unit>h2{font-size:13px;font-weight:500;margin:0 0 16px;color:var(--ds-text-secondary)}
 ul{list-style:none;margin:0;padding:0}
 ul ul{padding-inline-start:20px}
 a{display:flex;align-items:center;min-block-size:44px;font-size:14px;color:var(--ds-text-secondary);text-decoration:none;box-sizing:border-box}
 a[aria-current]{color:var(--ds-text-primary);font-weight:500}
 /* A: a ruled edge with a thick bar on the current one (the scrollspy default) */
 .A ul{border-inline-start:1px solid var(--ds-line-ring)}
 .A a{padding-inline-start:16px;margin-inline-start:-1px;border-inline-start:2px solid transparent}
 .A a[aria-current]{border-inline-start-color:var(--ds-text-primary)}
 /* B: a legend; one fixed gutter holds the ink index mark, so the words never move */
 .B a{padding-inline-start:20px;position:relative}
 .B a[aria-current]::before{content:"";position:absolute;inset-inline-start:0;inline-size:10px;block-size:0;border-block-end:2px solid var(--ds-text-primary);border-radius:99px}
 /* C: a printed scale; a tick for each heading on a dotted rail, a longer tick for the current */
 .C ul{position:relative;padding-inline-start:0}
 .C>ul::before{content:"";position:absolute;inset-block:8px;inset-inline-start:6px;inline-size:2px;background:radial-gradient(circle,var(--ds-line-ring) 50%,transparent 55%) 0 0/100% 8px repeat-y}
 .C a{padding-inline-start:28px;position:relative}
 .C a::before{content:"";position:absolute;inset-inline-start:0;inline-size:6px;block-size:0;border-block-end:1px solid var(--ds-line-ring)}
 .C a[aria-current]::before{inline-size:14px;border-block-end:2px solid var(--ds-text-primary)}
</style></head><body>
<h1>Anchor · the "on this page" list</h1>
<div class="row">
<script>
 const list = `<ul>
  <li><a href="#a">Overview</a></li>
  <li><a href="#b" aria-current="location">Wiring</a>
   <ul><li><a href="#b1">Hub</a></li><li><a href="#b2">Sensors</a></li></ul></li>
  <li><a href="#c">Schedules</a></li>
  <li><a href="#d">Reset</a></li></ul>`;
 const set = [['A','a ruled edge, thick bar on the current'],['B','legend gutter with one ink index mark'],['C','printed scale: ticks on a dotted rail']];
 document.currentScript.insertAdjacentHTML('beforebegin', set.map(([k,n])=>`<div class="unit ${k}"><h2>${k} · ${n}</h2><nav aria-label="On this page">${list}</nav></div>`).join(''));
</script>
</div></body></html>
