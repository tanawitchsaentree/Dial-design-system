<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>dial lab · Kbd · three ways to print a key name</title>
<link rel="stylesheet" href="../../../packages/tokens/build/css/tokens.css">
<style>
 body{margin:0;padding:32px;background:var(--ds-surface-page);color:var(--ds-text-primary);font-family:var(--ds-type-family)}
 body[data-theme=dark], html[data-theme=dark] body{}
 h1{font-size:18px;font-weight:500;margin:0 0 18px}
 .row{display:flex;flex-wrap:wrap;gap:36px}
 .unit{inline-size:340px;padding:28px;border-radius:54px;background:var(--ds-surface-solid);box-shadow:var(--ds-elevation-unit)}
 .unit>h2{font-size:13px;font-weight:500;margin:0 0 20px;color:var(--ds-text-secondary)}
 p{font-size:16px;line-height:1.7;margin:0 0 14px}
 ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
 li{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--ds-text-secondary)}
 kbd{font-family:var(--ds-type-mono);font-size:var(--ds-type-label);font-weight:500;color:var(--ds-text-primary);display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;min-inline-size:24px;block-size:24px;padding-inline:8px;vertical-align:middle}
 .plus{color:var(--ds-text-secondary);margin-inline:4px}
 /* A: soft raised cap, the part shadow at small scale */
 .A kbd{background:var(--ds-surface-raised);border-radius:var(--ds-corner-mark);box-shadow:var(--ds-elevation-part)}
 /* B: flat top, hard lower edge like a key side seen from above: lit hairline on top-left, ring ink on the lower edge */
 .B kbd{background:var(--ds-surface-knob);border-radius:var(--ds-corner-mark);border:1px solid var(--ds-line-ring);border-block-end-width:3px;box-shadow:inset 1px 1px 0 var(--ds-material-lit)}
 /* C: cap sitting in a printed socket: sunken base, raised top nested inside */
 .C kbd{background:var(--ds-surface-sunken);border-radius:var(--ds-corner-mark);box-shadow:var(--ds-elevation-well);padding:3px;min-inline-size:30px;block-size:30px}
 .C kbd span{display:grid;place-items:center;min-inline-size:100%;block-size:100%;padding-inline:5px;box-sizing:border-box;background:var(--ds-surface-knob);border-radius:calc(var(--ds-corner-mark) - 3px);box-shadow:inset 1px 1px 0 var(--ds-material-lit),1px 1px 2px #0003}
 .dark{color:var(--ds-text-primary);padding:16px;border-radius:24px;margin-top:20px}
</style></head><body>
<h1>Kbd · a key name printed as a keycap</h1>
<div class="row" id="rows"></div>
<script>
 const cap=(c,t)=>c==='C'?`<kbd><span>${t}</span></kbd>`:`<kbd>${t}</kbd>`;
 const body=c=>`<p>Press ${cap(c,'Esc')} to close, or ${cap(c,'Enter')} to save.</p>
 <ul><li>Search<span>${cap(c,'Ctrl')}<span class=plus>+</span>${cap(c,'K')}</span></li><li>Next track<span>${cap(c,'Shift')}<span class=plus>+</span>${cap(c,'N')}</span></li><li>Mute<span>${cap(c,'M')}</span></li></ul>`;
 const names={A:'A · soft raised cap',B:'B · flat cap with a hard lower edge',C:'C · cap in a socket'};
 rows.innerHTML=['A','B','C'].map(c=>`<div class="unit ${c}"><h2>${names[c]}</h2>${body(c)}</div>`).join('');
 // dark variants underneath
 document.querySelectorAll('.unit').forEach(u=>{const d=document.createElement('div');d.className='dark';d.dataset.theme='dark';d.style.cssText='background:var(--ds-surface-solid)';u.append(d);d.innerHTML=u.querySelector('p').outerHTML;});
</script>
</body></html>
